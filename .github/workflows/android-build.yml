name: Android Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Project Lily
        shell: bash
        run: |
          set -e

          zipfile=$(find . -maxdepth 1 -type f -name "*.zip" | head -n1)

          if [ -z "$zipfile" ]; then
            echo "❌ No ZIP project found"
            exit 1
          fi

          echo "Using: $zipfile"

          rm -rf extracted
          mkdir extracted

          unzip -q -o "$zipfile" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | sort | head -200

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted -type f -name "settings.gradle*" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find extracted -type f -name "build.gradle*" -path "*/app/*" -print -quit | xargs -r dirname | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ Could not locate Android project"
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
          build-root-directory: ${{ env.PROJECT_DIR }}

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: project-lily-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
