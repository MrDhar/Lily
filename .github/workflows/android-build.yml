name: Android Build

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Find and extract Project Lily
        shell: bash
        run: |
          set -euo pipefail

          if find . -maxdepth 1 -type f -name 'settings.gradle*' | grep -q .; then
            echo "Project is already extracted."
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi

          zipfile="$(find . -maxdepth 1 -type f -name 'Project-Lily-Android-*.zip' | sort -V | tail -n1)"
          if [ -z "$zipfile" ]; then
            zipfile="$(find . -maxdepth 1 -type f -name '*.zip' | sort -V | tail -n1)"
          fi

          if [ -z "$zipfile" ]; then
            echo "No Project Lily ZIP found."
            exit 1
          fi

          echo "Using $zipfile"
          rm -rf extracted
          mkdir extracted
          unzip -q -o "$zipfile" -d extracted

          project_dir="$(find extracted -type f -name 'settings.gradle*' -print -quit | xargs -r dirname)"
          if [ -z "$project_dir" ]; then
            echo "Could not locate settings.gradle(.kts)."
            exit 1
          fi

          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Project: $project_dir"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: project-lily-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Builds a signed release AAB/APK using a keystore stored in repo secrets, so
  # no local Android Studio/Gradle install is needed to produce a publishable
  # build. Runs on a pushed "vX.Y.Z" tag, or manually via "Run workflow".
  #
  # One-time setup, in your repo's Settings -> Secrets and variables -> Actions:
  #   RELEASE_KEYSTORE_BASE64   base64 of your .jks file: base64 -w0 your.jks
  #   RELEASE_KEYSTORE_PASSWORD the keystore password
  #   RELEASE_KEY_ALIAS         the key alias (e.g. projectlily)
  #   RELEASE_KEY_PASSWORD      the key password
  # Without these four secrets set, this job fails fast with a clear message
  # instead of silently producing an unsigned build.
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Find and extract Project Lily
        shell: bash
        run: |
          set -euo pipefail

          if find . -maxdepth 1 -type f -name 'settings.gradle*' | grep -q .; then
            echo "Project is already extracted."
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi

          zipfile="$(find . -maxdepth 1 -type f -name 'Project-Lily-Android-*.zip' | sort -V | tail -n1)"
          if [ -z "$zipfile" ]; then
            zipfile="$(find . -maxdepth 1 -type f -name '*.zip' | sort -V | tail -n1)"
          fi

          if [ -z "$zipfile" ]; then
            echo "No Project Lily ZIP found."
            exit 1
          fi

          echo "Using $zipfile"
          rm -rf extracted
          mkdir extracted
          unzip -q -o "$zipfile" -d extracted

          project_dir="$(find extracted -type f -name 'settings.gradle*' -print -quit | xargs -r dirname)"
          if [ -z "$project_dir" ]; then
            echo "Could not locate settings.gradle(.kts)."
            exit 1
          fi

          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Project: $project_dir"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Write signing config from secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.RELEASE_KEY_ALIAS }}" ] || [ -z "${{ secrets.RELEASE_KEY_PASSWORD }}" ]; then
            echo "One or more RELEASE_* secrets are missing. See the comment above the 'release' job for setup steps."
            exit 1
          fi
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${{ env.PROJECT_DIR }}/release.jks"
          cat > "${{ env.PROJECT_DIR }}/keystore.properties" <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build signed release (AAB + APK)
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle bundleRelease assembleRelease --stacktrace --no-daemon

      - name: Upload release build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: project-lily-release
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk

